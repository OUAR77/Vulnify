{% extends "base.html" %}

<section class="section" style="padding-top:120px;min-height:80vh;display:flex;align-items:center;justify-content:center">

    <div style="font-size:80px;font-weight:700;color:var(--accent);font-family:var(--font-display);line-height:1">404</div>
    <h2 style="margin-top:12px;font-size:24px">Página no encontrada</h2>

    <div style="margin-top:24px;display:flex;gap:12px;justify-content:center">
