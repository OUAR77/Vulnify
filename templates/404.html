<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada · Vulnify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:var(--font-sans);color:var(--text)}
    .error-wrap{text-align:center;padding:40px 20px;max-width:480px}
    .error-code{font-size:100px;font-weight:900;letter-spacing:-6px;background:linear-gradient(135deg,var(--accent),#b8943f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px;font-family:var(--font-serif)}
    .error-shield{margin-bottom:24px}
    .error-wrap h1{font-size:22px;font-weight:700;margin-bottom:8px;font-family:var(--font-sans)}
    .error-wrap p{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.6}
    .error-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .error-actions .btn{text-decoration:none}
  </style>
</head>
<body>
<div class="error-wrap">
  <div class="error-shield">
    <svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
      <path d="M32 4L8 16v12c0 14.5 10.3 28 24 32 13.7-4 24-17.5 24-32V16L32 4z"/>
      <circle cx="32" cy="28" r="2" fill="var(--accent)"/>
      <path d="M32 34v8" stroke-width="2"/>
      <path d="M24 22l4 4" opacity="0.6"/>
      <path d="M40 22l-4 4" opacity="0.6"/>
    </svg>
  </div>
  <div class="error-code">404</div>
  <h1>Esto no era lo que buscabas</h1>
  <p>La página que intentas visitar no existe, fue movida o nunca estuvo aquí. Los bugs están en los programas, no en las URLs.</p>
  <div class="error-actions">
    <a href="/" class="btn btn-accent">Volver al inicio</a>
    <a href="/programas" class="btn btn-ghost">Ver programas</a>
  </div>
</div>
</body>
</html>
