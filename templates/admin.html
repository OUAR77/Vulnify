<link rel="stylesheet" href="/static/css/styles.css?v=4">
<style>
.tab-bar{display:flex;gap:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px;width:fit-content;margin-bottom:24px}
.tab-btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;border:none;cursor:pointer;background:transparent;color:var(--text-secondary);transition:all .15s}
.tab-btn.active{background:var(--bg-surface);color:var(--text);border:1px solid var(--border)}
.tab-content{display:none}
.tab-content.active{display:block}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.admin-table tr:hover td{background:var(--bg-surface)}
.role-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;text-transform:capitalize}
.role-badge.hunter{background:var(--accent-light);color:var(--accent)}
.role-badge.company{background:rgba(74,154,217,0.08);color:#4a9ad9}
.role-badge.admin{background:rgba(245,158,11,0.1);color:#f59e0b}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button><nav class="nav"><a class="nav-link" href="/admin" style="color:var(--text);">Admin</a><a class="nav-link" href="/stats">Estadisticas</a><a class="nav-link" href="/programas">Programas</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">&#127769;</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesion</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div>

  <div id="mobileNavLinks">

  </div>

<section class="section"><div class="container" id="adminContent"><div style="text-align:center;padding:40px"><div class="spinner spinner-lg"></div></div></div></section>

<div class="modal-overlay" id="modalOverlay"><div class="modal-body" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<button class="back-top" id="backTop" aria-label="Volver arriba">&uarr;</button>
<script src="/static/js/script.js?v=5"></script>
<script>
(function(){
var _adminToken = null;
async function ensureToken() {
  if (_adminToken) return _adminToken;
  _adminToken = await getValidToken();
  return _adminToken;
}
const root = () => document.getElementById('adminContent');

(async () => {
  try {
    var token = await ensureToken();
    if (!token) {
      root().innerHTML = '<div style="text-align:center;padding:60px"><h2>Inicia sesion como admin</h2><button class="btn btn-accent" onclick="openModal(\'login\')">Login</button></div>';
      return;
    }
    const headers = { 'Authorization': `Bearer ${token}` };
    const jsonHeaders = { ...headers, 'Content-Type': 'application/json' };
    const me = await (await fetch('/api/auth/me', { headers })).json();
    if (me.role !== 'admin') {
      root().innerHTML = `<div style="text-align:center;padding:60px">
        <h2>Solo administradores</h2><p>Tu rol es: ${me.role}</p>
        <p style="font-size:12px;color:var(--text-tertiary)">Usa POST /api/admin/seed para crear admin inicial</p>
        <button class="btn btn-accent" style="margin-top:12px" onclick="seedMe()">Crear admin inicial</button></div>`;
      return;
    }
    document.getElementById('headerUserName').textContent = me.name;
    document.getElementById('headerUser').style.display = 'inline-flex';
    document.getElementById('headerAuth').style.display = 'none';
    document.title = 'Admin — Vulnify';
    await loadAdmin(me);
  } catch {
    root().innerHTML = '<div style="text-align:center;padding:60px">Error al verificar sesion</div>';
  }
})();

async function loadAdmin(user) {
  root().innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px">
    <div><h1 style="font-size:28px;font-weight:700;letter-spacing:-1px;">Panel de administracion</h1><p style="color:var(--text-secondary);font-size:14px">Gestiona usuarios, programas y reportes.</p></div>
    <div style="display:flex;gap:8px"><a href="/stats" class="btn btn-outline" style="font-size:12px">Estadisticas</a></div></div>
    <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="users">Usuarios</button>
    <button class="tab-btn" data-tab="programs">Programas</button>
    <button class="tab-btn" data-tab="reports">Reportes</button>
    <button class="tab-btn" data-tab="plans">Planes</button>
    <button class="tab-btn" data-tab="revenue">Ingresos</button></div>
    <div class="tab-content active" id="tabUsers"><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Empresa</th><th>Registro</th><th>Acciones</th></tr></thead><tbody id="usersBody"><tr><td colspan="7" style="text-align:center;padding:20px"><div class="spinner"></div></td></tr></tbody></table></div></div>
    <div class="tab-content" id="tabPrograms"><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>ID</th><th>Empresa</th><th>Industria</th><th>Recompensa</th><th>Estado</th><th>Reportes</th><th>Creado</th></tr></thead><tbody id="programsBody"><tr><td colspan="7" style="text-align:center;padding:20px"><div class="spinner"></div></td></tr></tbody></table></div></div>
    <div class="tab-content" id="tabReports"><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>ID</th><th>Reporte</th><th>Severidad</th><th>Estado</th><th>Recompensa</th><th>Programa</th><th>Hunter</th><th>Creado</th></tr></thead><tbody id="reportsBody"><tr><td colspan="8" style="text-align:center;padding:20px"><div class="spinner"></div></td></tr></tbody></table></div></div>
    <div class="tab-content" id="tabPlans"><div id="plansBody"><div style="text-align:center;padding:20px"><div class="spinner"></div></div></div></div>
    <div class="tab-content" id="tabRevenue"><div id="revenueBody"><div style="text-align:center;padding:20px"><div class="spinner"></div></div></div></div>`;

  try {
    const [usersRes, progsRes, repsRes, plansData, revenueData] = await Promise.all([
      (await fetch('/api/admin/users', { headers })).json(),
      (await fetch('/api/admin/programs', { headers })).json(),
      (await fetch('/api/admin/reports', { headers })).json(),
      (await fetch('/api/admin/plans', { headers })).json(),
      (await fetch('/api/admin/revenue', { headers })).json(),
    ]);
    const users = usersRes.items || usersRes;
    const progs = progsRes.items || progsRes;
    const reps = repsRes.items || repsRes;

    document.getElementById('usersBody').innerHTML = users.length
      ? users.map(u => `<tr>
        <td style="color:var(--text-tertiary);font-family:monospace;font-size:12px">${u.id}</td>
        <td style="font-weight:500">${esc(u.name)}</td>
        <td style="color:var(--text-secondary)">${esc(u.email)}</td>
        <td><select onchange="changeRole(${u.id},this.value)" style="font-size:10px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg-surface);color:var(--text);font-family:inherit">
          <option value="hunter"${u.role==='hunter'?' selected':''}>Hunter</option>
          <option value="company"${u.role==='company'?' selected':''}>Company</option>
          <option value="admin"${u.role==='admin'?' selected':''}>Admin</option></select></td>
        <td style="color:var(--text-tertiary)">${esc(u.company||'—')}</td>
        <td style="color:var(--text-tertiary);font-size:12px">${(u.created_at||'').slice(0,10)}</td>
        <td><button class="action-btn" style="font-size:10px;padding:4px 8px" onclick="deleteUser(${u.id})"${u.id===user.id?' disabled style="opacity:.4"':''}>Eliminar</button></td></tr>`).join('')
      : '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-tertiary)">No hay usuarios</td></tr>';

    document.getElementById('programsBody').innerHTML = progs.length
      ? progs.map(p => `<tr>
        <td style="color:var(--text-tertiary);font-family:monospace;font-size:12px">${p.id}</td>
        <td style="font-weight:500">${esc(p.company_name)}</td>
        <td style="color:var(--text-secondary)">${esc(p.industry)}</td>
        <td style="font-weight:600;color:var(--accent)">${Number(p.max_reward).toLocaleString()}€</td>
        <td><span class="status-badge ${p.status}">${p.status}</span></td>
        <td style="text-align:center">${p.reports_count}</td>
        <td style="color:var(--text-tertiary);font-size:12px">${(p.created_at||'').slice(0,10)}</td></tr>`).join('')
      : '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-tertiary)">No hay programas</td></tr>';

    const sevM = {critical:'Critico',high:'Alto',medium:'Medio',low:'Bajo',info:'Info'};
    const stM = {pending:'Pendiente',valid:'Valido',invalid:'Invalido',paid:'Pagado'};
    document.getElementById('reportsBody').innerHTML = reps.length
      ? reps.map(r => `<tr>
        <td style="color:var(--text-tertiary);font-family:monospace;font-size:12px">${r.id}</td>
        <td><a href="/report/${r.id}" style="color:var(--text);text-decoration:none;font-weight:500">${esc(r.title)}</a></td>
        <td><span class="sev-badge ${r.severity}">${sevM[r.severity]||r.severity}</span></td>
        <td><span class="status-badge ${r.status}">${stM[r.status]||r.status}</span></td>
        <td style="font-weight:600">${r.reward?r.reward+'€':'—'}</td>
        <td style="color:var(--text-secondary)">#${r.program_id}</td>
        <td style="color:var(--text-secondary)">#${r.hunter_id}</td>
        <td style="color:var(--text-tertiary);font-size:12px">${(r.created_at||'').slice(0,10)}</td></tr>`).join('')
      : '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-tertiary)">No hay reportes</td></tr>';
    window._lastPlans = plansData;
    document.getElementById('plansBody').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="font-size:18px;font-weight:600">Planes de suscripción</h2>
        <button class="btn btn-accent" style="font-size:12px;padding:6px 14px" onclick="showPlanForm()">+ Nuevo plan</button>
      </div>
      <table class="admin-table"><thead><tr><th>ID</th><th>Nombre</th><th>Precio/mes</th><th>Precio/año</th><th>Stripe ID/mes</th><th>Stripe ID/año</th><th>Max reports</th><th>Max progs</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>${
        (plansData||[]).length ? plansData.map(p => `<tr>
          <td style="font-family:monospace;font-size:12px">${p.id}</td>
          <td style="font-weight:500">${esc(p.name)}</td>
          <td>${p.price_monthly}€</td>
          <td>${p.price_yearly ? p.price_yearly+'€' : '—'}</td>
          <td style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(p.stripe_price_id_monthly || '') || '—'}</td>
          <td style="font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(p.stripe_price_id_yearly || '') || '—'}</td>
          <td>${p.max_reports===-1?'∞':p.max_reports}</td>
          <td>${p.max_programs===-1?'∞':p.max_programs}</td>
          <td>${p.active ? '<svg viewBox="0 0 10 10" width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="#22c55e"/></svg>' : '<svg viewBox="0 0 10 10" width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="#ef4444"/></svg>'}</td>
          <td><button class="action-btn" style="font-size:10px" onclick="editPlan(${p.id})">Editar</button>
          <button class="action-btn" style="font-size:10px;color:#f87171" onclick="deletePlan(${p.id})">Eliminar</button></td></tr>`).join('')
        : '<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--text-tertiary)">No hay planes</td></tr>'
      }</tbody></table>
      <div id="planForm" style="display:none;margin-top:20px;padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md)">
        <h3 style="font-size:16px;font-weight:600;margin-bottom:12px" id="planFormTitle">Nuevo plan</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label>Nombre</label><input id="pfName" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Descripción</label><input id="pfDesc" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Precio mensual (€)</label><input id="pfMonthly" type="number" min="0" step="0.01" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Precio anual (€, opcional)</label><input id="pfYearly" type="number" min="0" step="0.01" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Stripe Price ID (mensual)</label><input id="pfStripeMonthly" placeholder="price_xxx" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Stripe Price ID (anual, opcional)</label><input id="pfStripeYearly" placeholder="price_xxx" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Max reportes (-1 = ilimitado)</label><input id="pfReports" type="number" value="0" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
          <div class="field"><label>Max programas (-1 = ilimitado)</label><input id="pfPrograms" type="number" value="0" class="prog-form" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text);font-family:inherit;font-size:13px"></div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-accent" onclick="savePlan()">Guardar</button>
          <button class="btn btn-ghost" onclick="document.getElementById('planForm').style.display='none'">Cancelar</button>
        </div>
      </div>`;

    const r = revenueData || {};
    document.getElementById('revenueBody').innerHTML = `
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px">Ingresos de la plataforma</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px">
        <div class="stat-counter"><div class="stat-counter-num" style="font-size:28px;color:var(--accent)">${r.total_commission_earned||0}€</div><div class="stat-counter-label">Comisiones totales</div></div>
        <div class="stat-counter"><div class="stat-counter-num" style="font-size:28px">${r.total_bounties_processed||0}€</div><div class="stat-counter-label">Bounties procesados</div></div>
        <div class="stat-counter"><div class="stat-counter-num" style="font-size:28px">${r.active_subscriptions||0}</div><div class="stat-counter-label">Suscripciones activas</div></div>
        <div class="stat-counter"><div class="stat-counter-num" style="font-size:28px">${r.total_payouts||0}</div><div class="stat-counter-label">Pagos realizados</div></div>
      </div>
      <p style="font-size:13px;color:var(--text-tertiary)">Comisión por bounty: <strong>${revenueData?.commission_percentage || settings?.PLATFORM_COMMISSION_PERCENT || 10}%</strong></p>`;

    var missingStripe = (plansData||[]).some(function(p){ return p.price_monthly > 0 && !p.stripe_price_id_monthly; });
    if(missingStripe){
      var banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(239,68,68,0.08);border:1px solid #ef4444;border-radius:8px;padding:16px 20px;margin-top:20px;display:flex;align-items:center;gap:10px;font-size:13px';
      banner.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> <span style="color:var(--text)">Planes de pago sin Stripe configurado. Asigna <strong>stripe_price_id_monthly</strong> desde la pestaña <strong>Planes</strong>.</span>';
      document.getElementById('revenueBody').appendChild(banner);
    }
  } catch { showToast('Error al cargar datos'); }

  document.getElementById('tabBar').addEventListener('click', function(e) {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.seedMe = async function() {
  try {
    const res = await fetch('/api/admin/seed', { method: 'POST', headers: jsonHeaders });
    const d = await res.json();
    if (!res.ok) { showToast(d.detail || 'Error'); return; }
    localStorage.setItem('token', d.token);
    localStorage.setItem('user', JSON.stringify(d.user));
    showToast('Admin creado');
    setTimeout(() => location.reload(), 1000);
  } catch { showToast('Error'); }
};

window.showPlanForm = function() { document.getElementById('planForm').style.display='block'; document.getElementById('planFormTitle').textContent='Nuevo plan'; window._editPlanId=null; };
window.editPlan = async function(id) {
  const plans = window._lastPlans||[];
  const p = plans.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('planForm').style.display='block';
  document.getElementById('planFormTitle').textContent='Editar plan';
  document.getElementById('pfName').value=p.name;
  document.getElementById('pfDesc').value=p.description||'';
  document.getElementById('pfMonthly').value=p.price_monthly;
  document.getElementById('pfYearly').value=p.price_yearly||'';
  document.getElementById('pfStripeMonthly').value=p.stripe_price_id_monthly||'';
  document.getElementById('pfStripeYearly').value=p.stripe_price_id_yearly||'';
  document.getElementById('pfReports').value=p.max_reports;
  document.getElementById('pfPrograms').value=p.max_programs;
  window._editPlanId=id;
};
window.savePlan = async function() {
  const body = {
    name: document.getElementById('pfName').value,
    description: document.getElementById('pfDesc').value,
    price_monthly: parseFloat(document.getElementById('pfMonthly').value)||0,
    price_yearly: parseFloat(document.getElementById('pfYearly').value)||null,
    stripe_price_id_monthly: document.getElementById('pfStripeMonthly').value || null,
    stripe_price_id_yearly: document.getElementById('pfStripeYearly').value || null,
    max_reports: parseInt(document.getElementById('pfReports').value)||0,
    max_programs: parseInt(document.getElementById('pfPrograms').value)||0,
    active: true,
  };
  const id = window._editPlanId;
  const url = id ? `/api/admin/plans/${id}` : '/api/admin/plans';
  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, {method, headers: jsonHeaders, body: JSON.stringify(body)});
    if(res.ok){showToast('Plan guardado');location.reload()}
    else {const d=await res.json();showToast(d.detail||'Error')}
  } catch{showToast('Error')}
};
window.deletePlan = async function(id) {
  if(!confirm('Eliminar plan?')) return;
  try {
    const res = await fetch(`/api/admin/plans/${id}`, {method:'DELETE', headers});
    if(res.ok) location.reload();
    else showToast((await res.json()).detail);
  } catch{showToast('Error')}
};

window.changeRole = async function(id, role) {
  try {
    const res = await fetch(`/api/admin/users/${id}`, { method: 'PUT', headers: jsonHeaders, body: JSON.stringify({role}) });
    if (res.ok) showToast('Rol actualizado');
    else { const d = await res.json(); showToast(d.detail || 'Error'); }
  } catch { showToast('Error'); }
};

window.deleteUser = async function(id) {
  if (!confirm('Eliminar usuario?')) return;
  try {
    const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE', headers });
    if (res.ok) location.reload();
  } catch { showToast('Error'); }
};

})();
</script>
</body>
