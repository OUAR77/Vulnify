<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación — Vulnify</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css">
<style>
.plan-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;background:var(--bg-card);transition:border-color .15s;display:flex;flex-direction:column}
.plan-card:hover{border-color:var(--accent)}
.plan-card.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan-card h3{font-size:18px;font-weight:700;margin-bottom:4px}
.plan-price{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--accent);margin:12px 0}
.plan-price small{font-size:14px;font-weight:400;color:var(--text-tertiary)}
.plan-features{list-style:none;padding:0;margin:16px 0;flex:1}
.plan-features li{padding:6px 0;font-size:13px;color:var(--text-secondary)}
.plan-features li::before{content:"✓ ";color:#16a34a;font-weight:700}
.sub-status{padding:16px 20px;border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:24px}
.sub-status.active{border-color:#16a34a;background:rgba(22,163,74,0.05)}
.sub-status.canceled{border-color:#f87171;background:rgba(248,113,113,0.05)}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><nav class="nav"><a class="nav-link" href="/company">Panel</a><a class="nav-link" href="/stats">Estadísticas</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">&#127769;</button><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div></header>

<section class="section"><div class="container" id="billingContent"><p style="text-align:center;padding:40px">Cargando...</p></div></section>

<div class="toast" id="toast"></div>
<button class="back-top" id="backTop" aria-label="Volver arriba">&uarr;</button>
<script src="/static/js/script.js"></script>
<div class="modal-overlay" id="modalOverlay"><div class="modal-body" id="modalBody"></div></div>
<script>
(function(){
const token = localStorage.getItem('token');
if(!token){window.location.href='/';return}

const headers = {'Content-Type':'application/json',Authorization:'Bearer '+token};
const API = '/api';

async function loadBilling(){
  try{
    const me = await (await fetch(API+'/auth/me',{headers})).json();
    if(me.role!=='company'){document.getElementById('billingContent').innerHTML='<div style="text-align:center;padding:60px">Solo para empresas</div>';return}
    document.getElementById('headerUserName').textContent=me.name;
    document.getElementById('headerUser').style.display='inline-flex';

    const [plans, sub] = await Promise.all([
      (await fetch(API+'/plans',{headers})).json(),
      (await fetch(API+'/company/subscription',{headers})).json(),
    ]);

    const params = new URLSearchParams(location.search);
    const success = params.get('success');
    const canceled = params.get('canceled');

    let html = '<h1 style="font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:32px">Facturación y planes</h1>';
    if(success) html += '<div class="sub-status active" style="padding:16px;margin-bottom:20px">Suscripción activada correctamente</div>';
    if(canceled) html += '<div class="sub-status" style="padding:16px;margin-bottom:20px;border-color:var(--text-tertiary)">Proceso cancelado</div>';

    if(sub.subscribed){
      html += '<div class="sub-status '+sub.status+'">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">';
      html += '<div><strong style="font-size:16px">'+(sub.plan?.name||'Suscripción')+'</strong>';
      html += '<span class="status-badge '+sub.status+'" style="margin-left:8px;text-transform:capitalize">'+sub.status+'</span>';
      html += '<div style="font-size:13px;color:var(--text-tertiary);margin-top:4px">';
      if(sub.current_period_end) html += 'Válido hasta '+sub.current_period_end.slice(0,10);
      html += '</div></div>';
      if(sub.status==='active') html += '<button class="btn btn-ghost" onclick="cancelSub()" style="color:#f87171;font-size:12px">Cancelar suscripción</button>';
      html += '</div></div>';
    } else {
      html += '<p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px">Elige un plan para empezar a usar Vulnify. Comisión por bounty: <strong>10%</strong>.</p>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">';
      for(const p of plans){
        html += '<div class="plan-card">';
        html += '<h3>'+p.name+'</h3>';
        html += '<p style="font-size:13px;color:var(--text-tertiary)">'+p.description+'</p>';
        html += '<div class="plan-price">'+p.price_monthly+'€ <small>/mes</small></div>';
        if(p.price_yearly) html += '<div style="font-size:13px;color:var(--text-tertiary)">'+p.price_yearly+'€ /año</div>';
        html += '<ul class="plan-features">';
        if(p.max_reports===-1) html += '<li>Reportes ilimitados</li>';
        else html += '<li>Hasta '+p.max_reports+' reportes/mes</li>';
        if(p.max_programs===-1) html += '<li>Programas ilimitados</li>';
        else html += '<li>Hasta '+p.max_programs+' programas</li>';
        for(const f of (p.features||[])) html += '<li>'+f+'</li>';
        html += '</ul>';
        html += '<button class="btn btn-accent" style="width:100%;justify-content:center" onclick="window.subscribe('+p.id+')">Contratar</button>';
        html += '</div>';
      }
      html += '</div>';
    }
    document.getElementById('billingContent').innerHTML = html;
  } catch(e){
    document.getElementById('billingContent').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-tertiary)">Error al cargar</div>';
  }
}

loadBilling();

window.subscribe = async function(planId){
  try{
    const res = await fetch(API+'/company/subscribe', {method:'POST', headers, body: JSON.stringify({plan_id: planId, interval:'month'})});
    const data = await res.json();
    if(!res.ok){showToast(data.detail);return}
    if(data.checkout_url) window.location.href = data.checkout_url;
    else location.reload();
  } catch(e){showToast('Error')}
};

window.cancelSub = async function(){
  if(!confirm('¿Cancelar suscripción?')) return;
  try{
    const res = await fetch(API+'/company/subscription/cancel',{method:'POST',headers});
    const data = await res.json();
    if(res.ok){showToast('Suscripción cancelada');setTimeout(function(){location.reload()},1000)}
    else showToast(data.detail);
  }catch{showToast('Error')}
};
})();
</script>
</body>
</html>
