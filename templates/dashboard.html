{% extends "base.html" %}
{% block title %}Dashboard — Vulnify{% endblock %}
{% block content %}
<section class="section" style="padding-top:140px">
  <div class="container">
    <div class="dash-header reveal">
      <div class="section-label">Panel</div>
      <h1>Bienvenido</h1>
      <p>Resumen de tu monitorización de brechas.</p>
    </div>

    <div class="dash-stats reveal" id="stats-row">
      <div class="dash-stat"><div class="n" id="stat-assets">-</div><div class="l">Activos</div></div>
      <div class="dash-stat"><div class="n" id="stat-alerts">-</div><div class="l">Alertas</div></div>
      <div class="dash-stat"><div class="n" id="stat-unread">-</div><div class="l">Sin leer</div></div>
      <div class="dash-stat"><div class="n" id="stat-breached">-</div><div class="l">Comprometidos</div></div>
    </div>

    <div class="dash-tabs">
      <button class="dash-tab active" data-tab="assets">Activos</button>
      <button class="dash-tab" data-tab="alerts">Alertas</button>
    </div>

    <div id="tab-assets">
      <div style="display:flex;gap:8px;margin-bottom:24px">
        <input type="text" id="new-asset" class="input" placeholder="ejemplo.com o email@ejemplo.com" style="flex:1">
        <button onclick="addAsset()" class="btn btn-accent btn-sm">Añadir</button>
      </div>
      <div id="assets-list"></div>
    </div>

    <div id="tab-alerts" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:12px;color:var(--text-tertiary)" id="alert-count"></span>
        <button onclick="markAllRead()" class="btn btn-ghost btn-sm">Marcar todo leído</button>
      </div>
      <div id="alerts-list" class="alert-list"></div>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
const TK = 'vulnify_token';
function gt() { return localStorage.getItem(TK); }

document.querySelectorAll('.dash-tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.dash-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-assets').style.display = 'none';
    document.getElementById('tab-alerts').style.display = 'none';
    document.getElementById('tab-' + b.dataset.tab).style.display = 'block';
  });
});

async function af(url, opts = {}) {
  const t = gt();
  if (!t) { window.location.href = '/login'; return null; }
  try {
    const r = await fetch(url, { ...opts, headers: { ...opts.headers, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } });
    if (r.status === 401) { localStorage.removeItem(TK); window.location.href = '/login'; return null; }
    return r;
  } catch { return null; }
}

async function loadDashboard() {
  const t = gt();
  if (!t) { window.location.href = '/login'; return; }
  const r = await af('/api/auth/me');
  if (!r) return;
  const me = await r.json();
  if (me.name) document.getElementById('headerUserName').textContent = me.name;
  loadStats();
  loadAssets();
  loadAlerts();
}

async function loadStats() {
  const r = await af('/api/assets');
  if (!r) return;
  const d = await r.json();
  document.getElementById('stat-assets').textContent = d.active_assets || 0;
  document.getElementById('stat-alerts').textContent = d.total_alerts || 0;
  document.getElementById('stat-unread').textContent = d.unread_alerts || 0;
  document.getElementById('stat-breached').textContent = d.assets_with_breaches || 0;
}

async function addAsset() {
  const val = document.getElementById('new-asset').value.trim();
  if (!val) return;
  const btn = document.querySelector('#tab-assets .btn');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await af('/api/assets', { method: 'POST', body: JSON.stringify({ value: val }) });
    if (!r) return;
    if (!r.ok) { const e = await r.json(); alert(e.detail || 'Error'); btn.disabled = false; btn.textContent = orig; return; }
    document.getElementById('new-asset').value = '';
    loadAssets(); loadStats();
  } catch { alert('Error'); }
  btn.disabled = false; btn.textContent = orig;
}

async function loadAssets() {
  const r = await af('/api/assets');
  if (!r) return;
  const d = await r.json();
  const list = document.getElementById('assets-list');
  if (!d.assets || !d.assets.length) { list.innerHTML = '<p style="font-size:13px;color:var(--text-tertiary);padding:24px 0">Sin activos monitorizados. Añade un dominio o email.</p>'; return; }
  list.innerHTML = d.assets.map(a => '<div class="asset-item"><div class="asset-info"><h4>' + a.value + '</h4><p>' + (a.type||'') + ' · ' + (a.status||'') + (a.last_checked ? ' · ' + a.last_checked : '') + (a.breaches_found > 0 ? ' · <span style="color:#ef4444">' + a.breaches_found + ' brechas</span>' : '') + '</p></div><button onclick="deleteAsset(' + a.id + ')" class="btn btn-ghost btn-sm" style="color:var(--text-tertiary)">Eliminar</button></div>').join('');
}

async function deleteAsset(id) {
  if (!confirm('¿Eliminar activo?')) return;
  await af('/api/assets/' + id, { method: 'DELETE' });
  loadAssets(); loadStats();
}

async function loadAlerts() {
  const r = await af('/api/alerts');
  if (!r) return;
  const d = await r.json();
  document.getElementById('alert-count').textContent = d.total + ' alertas (' + d.unread + ' sin leer)';
  const list = document.getElementById('alerts-list');
  if (!d.items || !d.items.length) { list.innerHTML = '<p style="font-size:13px;color:var(--text-tertiary);padding:24px 0">Sin alertas por ahora.</p>'; return; }
  list.innerHTML = d.items.map(a => {
    const sev = a.severity || 'info';
    const dt = a.created_at ? new Date(a.created_at).toLocaleDateString('es') : '';
    return '<div class="alert-item"' + (a.read ? '' : ' style="opacity:1"') + '><span class="sev-badge ' + sev + '">' + sev + '</span><div class="alert-info"><h4>' + (a.breach_name || 'Alerta') + '</h4><p>' + (a.description || '') + ' · ' + dt + '</p></div></div>';
  }).join('');
}

async function markAllRead() {
  await af('/api/alerts/read-all', { method: 'PUT' });
  loadAlerts();
}

loadDashboard();
</script>
{% endblock %}
