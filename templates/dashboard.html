<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Vulnify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a>
    <nav class="nav">
      <a class="nav-link" href="/programas">Programas</a>
      <a class="nav-link" href="/dashboard" style="color:var(--text);">Dashboard</a>
      <a class="nav-link" href="/report/new">Reportar bug</a>
      <a class="nav-link" href="/ai">IA Tools</a>
    </nav>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
      <button class="btn btn-ghost" id="dashUserName" onclick="logout()" style="display:none;"></button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:40px;">
      <div>
        <h1 style="font-size:28px;font-weight:800;letter-spacing:-1px;">Dashboard</h1>
        <p style="color:var(--text-secondary);font-size:14px;" id="dashSubtitle">Bienvenido de nuevo</p>
      </div>
      <a href="/report/new" class="btn btn-accent">Nuevo reporte</a>
    </div>

    <div class="stats-row" style="margin-bottom:40px;" id="dashStats">
      <div class="stat-counter">
        <div class="stat-counter-num" style="font-size:32px;" id="statReports">0</div>
        <div class="stat-counter-label">Reportes enviados</div>
      </div>
      <div class="stat-counter">
        <div class="stat-counter-num" style="font-size:32px;color:#16a34a;" id="statValid">0</div>
        <div class="stat-counter-label">Válidos</div>
      </div>
      <div class="stat-counter">
        <div class="stat-counter-num" style="font-size:32px;color:var(--accent);" id="statPaid">0</div>
        <div class="stat-counter-label">Pagados</div>
      </div>
      <div class="stat-counter">
        <div class="stat-counter-num" style="font-size:32px;color:var(--text-tertiary);" id="statPending">0</div>
        <div class="stat-counter-label">Pendientes</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h2 style="font-size:18px;font-weight:700;">Tus reportes</h2>
    </div>

    <div id="reportsList" style="display:flex;flex-direction:column;gap:8px;">
      <div style="text-align:center;padding:40px;color:var(--text-tertiary);font-size:14px;" id="reportsEmpty">
        Aún no has enviado ningún reporte.
      </div>
    </div>
  </div>
</section>

<footer class="footer" style="border-top:1px solid var(--border);">
  <div class="container footer-bottom" style="border:none;padding-top:0;">
    <span>© 2026 <span class="accent">Vulnify</span></span>
    <span><a href="/" style="color:var(--text-tertiary);text-decoration:none;font-size:12px;">Volver al inicio</a></span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js"></script>
<script>
async function loadDashboard() {
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = '/'; return; }

  try {
    const me = await (await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } })).json();
    if (me.role === 'company') { window.location.href = '/company'; return; }
    if (me.role === 'admin') { window.location.href = '/admin'; return; }
    document.getElementById('dashUserName').textContent = me.name;
    document.getElementById('dashUserName').style.display = 'inline-flex';
    document.getElementById('dashSubtitle').textContent = `Bienvenido de nuevo, ${me.name}`;

    const res = await fetch('/api/reports?per_page=50', { headers: { Authorization: `Bearer ${token}` } });
    const reportsData = await res.json();
    const reports = reportsData.items || [];
    const stats = { total: reports.length, valid: 0, paid: 0, pending: 0 };
    reports.forEach(r => {
      if (r.status === 'valid') stats.valid++;
      else if (r.status === 'paid') { stats.valid++; stats.paid++; }
      else stats.pending++;
    });
    document.getElementById('statReports').textContent = stats.total;
    document.getElementById('statValid').textContent = stats.valid;
    document.getElementById('statPaid').textContent = stats.paid;
    document.getElementById('statPending').textContent = stats.pending;

    const container = document.getElementById('reportsList');
    if (reports.length === 0) return;

    document.getElementById('reportsEmpty').style.display = 'none';
    container.innerHTML = reports.map(r => {
      const sevColors = { info: '#6b6b75', low: '#16a34a', medium: '#d97706', high: '#dc2626', critical: '#dc2626' };
      const sv = ['info','low','medium','high','critical'].includes(r.severity) ? r.severity : 'info';
      return `<a href="/report/${r.id}" class="mw-report" style="padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;">
        <span class="mw-dot" style="background:${sevColors[sv]}"></span>
        <span class="mw-name">${r.title}</span>
        <span class="mw-badge" style="color:${sevColors[sv]};background:${sevColors[sv]}15;
          text-transform:capitalize;">${sv} · ${r.status}</span>
      </a>`;
    }).join('');
  } catch {
    localStorage.removeItem('token');
    window.location.href = '/';
  }
}

loadDashboard();
</script>
</body>
</html>
