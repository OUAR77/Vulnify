<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall of Fame — Vulnify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/styles.css">
<style>
.hof-table{width:100%;border-collapse:collapse}
.hof-table th{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border)}
.hof-table td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px}
.hof-table tr:hover td{background:var(--bg-surface)}
.hof-rank{font-weight:700;font-size:15px;width:40px;color:var(--text-tertiary)}
.hof-rank.top1{color:#f59e0b}.hof-rank.top2{color:#a8a29e}.hof-rank.top3{color:#d97706}
.hof-name{font-weight:600}
.hof-name a{color:var(--text);text-decoration:none}
.hof-name a:hover{color:var(--accent)}
.hof-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--accent-light);color:var(--accent)}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><nav class="nav"><a class="nav-link" href="/programas">Programas</a><a class="nav-link" href="/hall-of-fame" style="color:var(--text)">Hall of Fame</a><a class="nav-link" href="/dashboard">Dashboard</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div></header>

<section class="section"><div class="container"><div class="section-header centered"><div class="section-label">Hall of Fame</div><h1 class="section-title">Top hunters</h1><p class="section-sub">Los mejores cazadores de bugs de la comunidad Vulnify.</p></div><div style="overflow-x:auto"><table class="hof-table"><thead><tr><th>#</th><th>Hunter</th><th>Bio</th><th>Válidos</th><th>Pagados</th><th>Desde</th></tr></thead><tbody id="hofBody"></tbody></table></div></div></section>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js"></script>
<script>
fetch('/api/hunters/leaderboard?per_page=50').then(r=>r.json()).then(d=>{const items=d.items||d;document.getElementById('hofBody').innerHTML=items.map((h,i)=>{const c=i===0?'top1':i===1?'top2':i===2?'top3':'';return `<tr><td class="hof-rank ${c}">${i+1}</td><td class="hof-name"><a href="/hunter/${h.id}">${h.name}</a></td><td style="color:var(--text-secondary);font-size:13px">${h.bio||'—'}</td><td><span class="hof-badge">${h.valid_reports}</span></td><td>${h.paid_reports}</td><td style="color:var(--text-tertiary);font-size:13px">${h.joined}</td></tr>`}).join('')});
</script>
</body>
</html>
