<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter — Vulnify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>!function(){try{var t=localStorage.getItem('theme'),h=document.documentElement,d=t?t==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;h.setAttribute('data-theme',d?'dark':'light');var v=d?['#08080a','#111114','#0d0d10','#e8e5e0','#8a8780','#5c5a55','#1e1d1b','#2d2b28','#d4a853','rgba(212,168,83,0.06)','rgba(212,168,83,0.12)','rgba(212,168,83,0.08)','0 4px 24px rgba(0,0,0,0.5)','0 12px 48px rgba(0,0,0,0.6)']:['#f8f7f5','#ffffff','#ffffff','#1a1816','#6e6b67','#9e9b97','#d6d3d0','#b8b5b0','#b8943f','rgba(184,148,63,0.06)','rgba(184,148,63,0.12)','rgba(184,148,63,0.08)','0 2px 12px rgba(0,0,0,0.04)','0 8px 32px rgba(0,0,0,0.06)'];var n=['--bg','--bg-card','--bg-surface','--text','--text-secondary','--text-tertiary','--border','--border-hover','--accent','--accent-light','--accent-mid','--accent-glow','--shadow','--shadow-lg'];for(var i=0;i<n.length;i++)h.style.setProperty(n[i],v[i])}catch(e){}}()</script>
<link rel="stylesheet" href="/static/css/styles.css?v=4">
<style>
.hunter-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button><nav class="nav"><a class="nav-link" href="/programas">Programas</a><a class="nav-link" href="/hall-of-fame">Hall of Fame</a><a class="nav-link" href="/dashboard">Dashboard</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div>
<div class="mobile-menu" id="mobileMenu">
  <div id="mobileNavLinks">
    <a class="nav-link" href="/programas">Programas</a>
    <a class="nav-link" href="/hall-of-fame">Hall of Fame</a>
    <a class="nav-link" href="/dashboard">Dashboard</a>
  </div>
  <div class="header-actions-mobile" id="mobileAuth">
    <button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button>
    <button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button>
  </div>
  <div class="header-actions-mobile" id="mobileUser" style="display:none">
    <a href="/dashboard" class="btn btn-ghost" id="mobileUserName" style="font-weight:600"></a>
    <button class="btn btn-ghost" onclick="logout()">Salir</button>
  </div>
</div>
</header>

<section class="section"><div class="container"><div id="hunterContent"></div></div></section>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js?v=5"></script>
<script>
const hid = location.pathname.split('/').pop();
fetch(`/api/hunters/${hid}`).then(r=>r.ok?r.json():Promise.reject()).then(h=>{
  document.title = `${h.name} — Vulnify`;
  const initials = h.name.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('hunterContent').innerHTML = `
    <div style="display:flex;align-items:center;gap:24px;margin-bottom:40px;flex-wrap:wrap">
      <div class="hunter-avatar">${initials}</div>
      <div><h1 style="font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:4px">${h.name}</h1>
      <p style="color:var(--text-secondary);font-size:14px">${h.bio||'Sin bio'}</p>
      <p style="color:var(--text-tertiary);font-size:12px;margin-top:4px">Miembro desde ${h.joined}</p></div>
    </div>
    <div class="stats-row">
      <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px">${h.total_reports}</div><div class="stat-counter-label">Reportes totales</div></div>
      <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:#16a34a">${h.valid_reports}</div><div class="stat-counter-label">Válidos</div></div>
      <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:var(--accent)">${h.paid_reports}</div><div class="stat-counter-label">Pagados</div></div>
      <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:var(--text-tertiary)">${h.total_reports-h.valid_reports}</div><div class="stat-counter-label">Pendientes</div></div>
    </div>`;
}).catch(()=>{document.getElementById('hunterContent').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-tertiary)">Hunter no encontrado</div>'});
</script>
</body>
</html>
