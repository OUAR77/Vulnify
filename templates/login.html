{% extends "base.html" %}
{% block title %}Acceder — Vulnify{% endblock %}
{% block header %}{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-inner">
    <a href="/" class="logo">Vulnify</a>
    <h1>Acceder</h1>
    <p class="auth-sub">Accede a tu panel de Vulnify.</p>
    <div id="error" style="color:#ef4444;font-size:13px;margin-bottom:12px;display:none"></div>
    <div class="auth-form">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn btn-primary" id="submit" style="width:100%;padding:14px;justify-content:center">Entrar</button>
    </div>
    <div class="auth-footer">
      ¿No tienes cuenta? <a href="/register">Regístrate</a>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
const planId = new URLSearchParams(window.location.search).get('plan');
const token = localStorage.getItem('vulnify_token');
if (token) { window.location.href = planId ? '/precios' : '/dashboard'; }

async function sar(t) {
  if (!planId) return '/dashboard';
  try {
    const r = await fetch('/api/subscribe', { method:'POST', headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'}, body:JSON.stringify({plan_id:parseInt(planId),interval:'month'}) });
    const d = await r.json();
    if (d.checkout_url) return d.checkout_url;
    if (d.free) return '/dashboard';
  } catch {}
  return '/dashboard';
}

document.getElementById('submit').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!email||!password) { const e=document.getElementById('error'); e.textContent='Completa todos los campos'; e.style.display='block'; return; }
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) });
    const d = await r.json();
    if (!r.ok) { const e=document.getElementById('error'); e.textContent=d.detail||'Error'; e.style.display='block'; return; }
    localStorage.setItem('vulnify_token', d.token);
    if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
    localStorage.setItem('user', JSON.stringify(d.user));
    window.location.href = await sar(d.token);
  } catch { const e=document.getElementById('error'); e.textContent='Error de conexión'; e.style.display='block'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('submit').click(); });
</script>
{% endblock %}
