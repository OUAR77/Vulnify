<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Monitorización de reputación online de Vulnify. Comprueba si tu dominio o email aparece en filtraciones de datos.">
  <title>Monitor de reputación — Vulnify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .inline-alert {
      padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 16px;
      font-size: 0.85rem; display: none;
    }
    .inline-alert.error { display: block; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.15); color: #fca5a5; }
    .search-section { max-width: 580px; margin: 0 auto 40px; }
    .check-item { display: flex; align-items: start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .check-item:last-child { border-bottom: none; }
    .check-item .icon { font-weight: 600; flex-shrink: 0; font-size: 1rem; }
    .check-item .name { font-weight: 600; color: var(--text); }
    .check-item .desc { color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px; }
    .type-toggle { display: flex; gap: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 16px; width: fit-content; }
    .type-btn { padding: 8px 20px; border: none; background: transparent; font-size: 12px; font-weight: 600; font-family: var(--font-sans); color: var(--text-secondary); cursor: pointer; border-radius: 4px; transition: all .15s; }
    .type-btn.active { background: var(--accent); color: #08080a; }
    .recent-scans { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
    .recent-scans h3 { font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-item { display: inline-block; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; margin: 4px; background: var(--bg-surface); }
    .recent-item:hover { border-color: var(--accent); color: var(--accent); }
    .breach-item { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 10px; transition: border-color .2s; }
    .breach-item:hover { border-color: var(--border-hover); }
    .breach-item .breach-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .breach-item .breach-date { font-size: 0.8rem; color: var(--text-tertiary); }
    .breach-item .breach-classes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .breach-item .breach-class { font-size: 10px; padding: 2px 8px; border-radius: 100px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-tertiary); }
    .clean-result { text-align: center; padding: 40px 20px; }
    .clean-result .icon { font-size: 3rem; margin-bottom: 12px; }
    .clean-result h3 { font-family: var(--font-sans); font-size: 1.1rem; margin-bottom: 6px; }
    .clean-result p { color: var(--text-secondary); font-size: 0.85rem; }
  </style>
</head>
<body>

<header class="header" id="header">
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Vulnify<span>.</span></a>
      <nav class="nav">
        <a href="/monitor" class="nav-link active">Monitor</a>
        <a href="/precios" class="nav-link">Precios</a>
        <a href="/dashboard" class="nav-link">Dashboard</a>
      </nav>
      <div class="header-actions">
        <button class="hamburger" id="hamburger" aria-label="Menú">
          <span></span><span></span><span></span>
        </button>
        <a href="/login" class="btn btn-ghost btn-sm">Iniciar sesión</a>
        <a href="/register" class="btn btn-primary btn-sm">Registrarse</a>
      </div>
    </div>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="/monitor" class="nav-link">Monitor</a>
    <a href="/precios" class="nav-link">Precios</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <div class="header-actions-mobile">
      <a href="/login" class="btn btn-ghost">Iniciar sesión</a>
      <a href="/register" class="btn btn-primary">Registrarse</a>
    </div>
  </div>
</header>

<section class="section" style="padding-top:100px">
  <div class="container">
    <div class="section-header centered">
      <div class="section-label">Monitor</div>
      <h2 class="section-title">Comprueba tu exposición digital</h2>
      <p class="section-sub">Introduce un dominio o email para saber si aparece en filtraciones de datos conocidas.</p>
    </div>

    <div class="search-section">
      <div class="type-toggle">
        <button class="type-btn active" data-type="domain">Dominio</button>
        <button class="type-btn" data-type="email">Email</button>
      </div>
      <div class="two-col" style="grid-template-columns:1fr auto;gap:8px">
        <input type="text" id="asset-input" placeholder="ejemplo.com" autocomplete="off" spellcheck="false" style="padding:14px 18px;font-size:1rem">
        <button id="check-btn" class="btn btn-accent btn-lg" style="padding:14px 28px">Comprobar</button>
      </div>
    </div>

    <div id="error-box" class="inline-alert error"></div>

    <div id="status" style="text-align:center;padding:40px 0;display:none">
      <div class="spinner spinner-lg" style="margin:0 auto 16px"></div>
      <p style="color:var(--text-secondary)">Buscando filtraciones...</p>
    </div>

    <div id="results" style="display:none">
      <div id="result-summary" class="card" style="margin-bottom:20px"></div>
      <div id="result-breaches"></div>
    </div>

    <div class="recent-scans">
      <h3>Consultas recientes</h3>
      <div id="recent-list"></div>
    </div>
  </div>
</section>

<script>
  let assetType = 'domain';

  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      assetType = btn.dataset.type;
      document.getElementById('asset-input').placeholder = assetType === 'domain' ? 'ejemplo.com' : 'email@ejemplo.com';
    });
  });

  const RECENT_KEY = 'vulnifyRecentChecks';

  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch { return []; }
  }

  function saveRecent(value) {
    let list = loadRecent().filter(d => d !== value);
    list.unshift(value);
    if (list.length > 6) list = list.slice(0, 6);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    renderRecent();
  }

  function renderRecent() {
    const list = loadRecent();
    const el = document.getElementById('recent-list');
    if (!list.length) { el.innerHTML = '<span style="color:var(--text-tertiary);font-size:0.85rem">Ninguna aún</span>'; return; }
    el.innerHTML = list.map(d => `<span class="recent-item" onclick="document.getElementById('asset-input').value='${d}';check()">${d}</span>`).join('');
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.classList.add('error');
  }
  function hideError() { document.getElementById('error-box').classList.remove('error'); }

  async function check() {
    const value = document.getElementById('asset-input').value.trim();
    if (!value) { showError('Introduce un dominio o email'); return; }

    hideError();
    document.getElementById('status').style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('check-btn').disabled = true;

    try {
      const resp = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: assetType, value })
      });
      if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || 'Error'); }
      const data = await resp.json();
      showResults(data, value);
      saveRecent(value);
    } catch (err) {
      showError(err.message);
    }
    document.getElementById('status').style.display = 'none';
    document.getElementById('check-btn').disabled = false;
  }

  function showResults(data, value) {
    document.getElementById('results').style.display = 'block';

    if (data.safe) {
      document.getElementById('result-summary').innerHTML = `
        <div class="clean-result">
          <div class="icon">🛡️</div>
          <h3>No se encontraron filtraciones</h3>
          <p>${value} no aparece en ninguna brecha de datos conocida. Sigue monitorizándolo para mantenerte protegido.</p>
        </div>
      `;
      document.getElementById('result-breaches').innerHTML = '';
      return;
    }

    document.getElementById('result-summary').innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <span style="font-size:2rem">${data.severity === 'critical' ? '🚨' : data.severity === 'high' ? '⚠️' : '🔶'}</span>
        <div style="flex:1">
          <strong style="font-size:1.1rem">${data.breaches_found} filtración(es) encontrada(s)</strong>
          <div style="margin-top:4px">
            <span class="sev-badge ${data.severity}" style="font-size:11px">Severidad: ${data.severity}</span>
          </div>
          <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:6px">${value} aparece en las siguientes brechas. Datos expuestos: ${(data.data_classes_exposed || []).join(', ') || 'N/A'}.</p>
        </div>
      </div>
    `;

    document.getElementById('result-breaches').innerHTML = data.breaches.map(b => `
      <div class="breach-item">
        <div class="breach-name">${b.breach_name}</div>
        <div class="breach-date">${b.breach_date || 'Fecha desconocida'} · <span class="sev-badge ${b.severity}">${b.severity}</span> · <span style="color:var(--text-tertiary);font-size:0.75rem">confianza: ${b.confidence || 'media'}</span></div>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin:6px 0">${b.description || ''}</div>
        <div class="breach-classes">${(b.data_classes || []).map(c => `<span class="breach-class">${c}</span>`).join('')}</div>
      </div>
    `).join('');

    window.scrollTo({ top: document.getElementById('results').offsetTop - 80, behavior: 'smooth' });
  }

  document.getElementById('check-btn').addEventListener('click', check);
  document.getElementById('asset-input').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });

  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobile-menu');
  if (hamburger) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.classList.toggle('menu-open');
    });
  }

  renderRecent();
</script>
</body>
</html>
