<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa — Vulnify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>!function(){try{var t=localStorage.getItem('theme'),h=document.documentElement,d=t?t==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;h.setAttribute('data-theme',d?'dark':'light');var v=d?['#08080a','#111114','#0d0d10','#e8e5e0','#8a8780','#5c5a55','#1e1d1b','#2d2b28','#d4a853','rgba(212,168,83,0.06)','rgba(212,168,83,0.12)','rgba(212,168,83,0.08)','0 4px 24px rgba(0,0,0,0.5)','0 12px 48px rgba(0,0,0,0.6)']:['#f8f7f5','#ffffff','#ffffff','#1a1816','#6e6b67','#9e9b97','#d6d3d0','#b8b5b0','#b8943f','rgba(184,148,63,0.06)','rgba(184,148,63,0.12)','rgba(184,148,63,0.08)','0 2px 12px rgba(0,0,0,0.04)','0 8px 32px rgba(0,0,0,0.06)'];var n=['--bg','--bg-card','--bg-surface','--text','--text-secondary','--text-tertiary','--border','--border-hover','--accent','--accent-light','--accent-mid','--accent-glow','--shadow','--shadow-lg'];for(var i=0;i<n.length;i++)h.style.setProperty(n[i],v[i])}catch(e){}}()</script>
<link rel="stylesheet" href="/static/css/styles.css?v=4">
<style>
.scope-list{list-style:none}
.scope-list li{padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.scope-list li::before{content:'→';color:var(--accent);font-size:12px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--bg-surface);color:var(--text-tertiary);margin:2px}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button><nav class="nav"><a class="nav-link" href="/programas">Programas</a><a class="nav-link" href="/hall-of-fame">Hall of Fame</a><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/ai">IA Tools</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div>
<div class="mobile-menu" id="mobileMenu">
  <div id="mobileNavLinks">
    <a class="nav-link" href="/programas">Programas</a>
    <a class="nav-link" href="/hall-of-fame">Hall of Fame</a>
    <a class="nav-link" href="/dashboard">Dashboard</a>
    <a class="nav-link" href="/ai">IA Tools</a>
  </div>
  <div class="header-actions-mobile" id="mobileAuth">
    <button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button>
    <button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button>
  </div>
  <div class="header-actions-mobile" id="mobileUser" style="display:none">
    <a href="/dashboard" class="btn btn-ghost" id="mobileUserName" style="font-weight:600"></a>
    <button class="btn btn-ghost" onclick="logout()">Salir</button>
  </div>
</div>
</header>

<section class="section"><div class="container" id="progContent"></div></section>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js?v=5"></script>
<script>
const pid = location.pathname.split('/').pop();
fetch(`/api/programs/${pid}`).then(r=>r.ok?r.json():Promise.reject()).then(p=>{
  document.title = `${p.company_name} — Vulnify`;
  document.getElementById('progContent').innerHTML = `
    <div style="margin-bottom:40px"><div class="section-label">Programa</div>
    <h1 style="font-size:32px;font-weight:800;letter-spacing:-1.5px;margin-bottom:4px">${p.company_name}</h1>
    <p style="color:var(--text-secondary);font-size:15px">${p.industry} · Hasta ${p.max_reward.toLocaleString()}€</p></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px">Scope</h3>
        <ul class="scope-list">${(p.scope||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:12px">Fuera de scope</h3>
        <ul class="scope-list">${(p.out_of_scope||[]).map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--accent)">${p.reports_count||0}</div>
        <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px">Reportes</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--accent2)">${p.hunters_count||0}</div>
        <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px">Hunters</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--text-secondary)">${p.disclosure_date ? new Date(p.disclosure_date).toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'}) : '—'}</div>
        <div style="font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px">Divulgación</div>
      </div>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:12px">Reglas</h3>
      <p style="color:var(--text-secondary);font-size:14px;line-height:1.6">${p.rules}</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <div>${(p.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
      <div style="display:flex;gap:10px">
        <a href="/report/new" class="btn btn-accent">Reportar bug →</a>
        <a href="/programas" class="btn btn-ghost">← Volver</a>
      </div>
    </div>`;
}).catch(()=>{document.getElementById('progContent').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-tertiary)">Programa no encontrado</div>'});
</script>
</body>
</html>
