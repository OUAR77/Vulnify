<link rel="stylesheet" href="/static/css/styles.css?v=4">
<style>
.sev-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.sev-badge.critical{color:#dc2626;background:#dc262615}
.sev-badge.high{color:#ef4444;background:#ef444415}
.sev-badge.medium{color:#d97706;background:#d9770615}
.sev-badge.low{color:#16a34a;background:#16a34a15}
.sev-badge.info{color:var(--text-tertiary);background:var(--bg-surface)}
.status-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.status-badge.pending{color:var(--text-tertiary);background:var(--bg-surface)}
.status-badge.valid{color:#16a34a;background:#dcfce7}
.status-badge.paid{color:#16a34a;background:#dcfce7}
.status-badge.invalid{color:#dc2626;background:#dc262615}
.ai-tools-output .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:100px;font-weight:600;margin-right:4px}
.ai-tools-output .tag.critical{color:#dc2626;background:#dc262615}
.ai-tools-output .tag.high{color:#ef4444;background:#ef444415}
.ai-tools-output .tag.medium{color:#d97706;background:#d9770615}
.ai-tools-output .tag.low{color:#16a34a;background:#16a34a15}
.ai-tools-output .tag.info{color:var(--text-tertiary);background:var(--bg-surface)}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button><nav class="nav"><a class="nav-link" href="/programas">Programas</a><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/report/new">Reportar</a><a class="nav-link" href="/ai">IA Tools</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div>

    <a class="nav-link" href="/programas">Programas</a>
    <a class="nav-link" href="/dashboard">Dashboard</a>
    <a class="nav-link" href="/report/new">Reportar</a>

    <button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button>
  </div>

<section class="section"><div class="container" id="reportContent"></div></section>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js?v=5"></script>
<script>
const rid = location.pathname.split('/').pop();
(async()=>{
  var token = await getValidToken();
  if(!token){window.location.href='/';return}
  const headers = {Authorization:`Bearer ${token}`};
  try {
    const r = await (await fetch(`/api/reports/${rid}`, {headers})).json();
    const sevMap = {critical:'Crítico',high:'Alto',medium:'Medio',low:'Bajo',info:'Info'};
    const statusMap = {pending:'Pendiente',valid:'Válido',invalid:'Inválido',paid:'Pagado'};
    const prog = await (await fetch(`/api/programs/${r.program_id}`)).json();
    document.title = `${r.title} — Vulnify`;
    document.getElementById('reportContent').innerHTML = `
      <div style="margin-bottom:32px"><a href="/dashboard" style="color:var(--text-tertiary);font-size:13px;text-decoration:none">← Dashboard</a></div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px">
        <div><div class="section-label">Reporte #${r.id}</div>
        <h1 style="font-size:26px;font-weight:800;letter-spacing:-1px">${r.title}</h1></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="sev-badge ${r.severity}">${sevMap[r.severity]||r.severity}</span>
          <span class="status-badge ${r.status}">${statusMap[r.status]||r.status}</span>
          ${r.reward ? `<span style="font-size:13px;font-weight:700;color:var(--accent)">${r.reward}€</span>` : ''}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px">
          <h3 style="font-size:14px;font-weight:600;color:var(--text-tertiary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Descripción</h3>
          <p style="color:var(--text-secondary);font-size:14px;line-height:1.7">${r.description}</p>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px">
          <h3 style="font-size:14px;font-weight:600;color:var(--text-tertiary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Impacto</h3>
          <p style="color:var(--text-secondary);font-size:14px;line-height:1.7">${r.impact||'No especificado'}</p>
        </div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-top:20px">
        <h3 style="font-size:14px;font-weight:600;color:var(--text-tertiary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Pasos para reproducir</h3>
        <pre style="color:var(--text-secondary);font-size:13px;line-height:1.7;font-family:'SF Mono',monospace;white-space:pre-wrap">${r.steps||'No especificado'}</pre>
      </div>
      ${r.attachment ? `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-top:16px;display:flex;align-items:center;gap:12px">
        <span style="font-size:14px">📎</span>
        <a href="/${r.attachment}" target="_blank" style="color:var(--accent);font-size:13px;font-weight:500">Archivo adjunto</a>
      </div>` : ''}
      <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;color:var(--text-tertiary);font-size:13px">
        <span>Programa: <a href="/programa/${r.program_id}" style="color:var(--accent)">${prog.company_name}</a></span>
        <span>·</span><span>Hunter ID: ${r.hunter_id}</span>
        <span>·</span><span>${r.created_at?.slice(0,10)}</span>
      </div>
      <div style="margin-top:24px;padding:24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg)">
        <h3 style="font-size:14px;font-weight:600;color:var(--text-tertiary);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px">🤖 Herramientas IA</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-ghost" onclick="aiAnalyzeReport('${r.title}','${r.description?.replace(/'/g,"\\'")}','${r.steps?.replace(/'/g,"\\'")}','${r.impact?.replace(/'/g,"\\'")}')" style="font-size:12px">🔍 Analizar con IA</button>
          <button class="btn btn-ghost" onclick="aiSuggestPoc('${r.title}','${r.description?.replace(/'/g,"\\'")}')" style="font-size:12px">💡 Sugerir PoC</button>
          <button class="btn btn-ghost" onclick="aiEnhanceDesc('${r.description?.replace(/'/g,"\\'")}')" style="font-size:12px">📝 Mejorar texto</button>
        </div>
        <div id="aiToolsOutput" class="ai-tools-output" style="margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap"></div>
      </div>`;
  } catch {
    document.getElementById('reportContent').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-tertiary)">Reporte no encontrado</div>';
  }
})();

async function aiCall(endpoint, body) {
  const token = await getValidToken();
  if (!token) return null;
  const out = document.getElementById('aiToolsOutput');
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) { out.textContent = 'Error al consultar IA'; return null; }
    return await res.json();
  } catch { out.textContent = 'Error de conexión'; return null; }
}

async function aiAnalyzeReport(title, desc, steps, impact) {
  const out = document.getElementById('aiToolsOutput');
  out.textContent = 'Analizando con IA...';
  const r = await aiCall('/api/ai/analyze', { title, description: desc, steps, impact });
  if (!r) return;
  out.innerHTML = `
    <div><span class="tag ${r.severity}">${r.severity?.toUpperCase()}</span>
    <strong>CWE:</strong> ${r.cwe_id || 'N/A'} |
    <strong>CVSS:</strong> ${r.cvss_score || 'N/A'} (${r.cvss_vector || ''})</div>
    <div style="margin-top:8px">${r.explanation || ''}</div>
  `;
}

async function aiSuggestPoc(title, desc) {
  const out = document.getElementById('aiToolsOutput');
  out.textContent = 'Generando PoC...';
  const r = await aiCall('/api/ai/suggest-poc', { description: `${title}\n${desc}` });
  out.textContent = r?.result || 'Error';
}

async function aiEnhanceDesc(desc) {
  const out = document.getElementById('aiToolsOutput');
  out.textContent = 'Mejorando texto...';
  const r = await aiCall('/api/ai/enhance', { text: desc, mode: 'grammar' });
  out.textContent = r?.result || 'Error';
}
</script>
</body>
</html>
