<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar bug — Vulnify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>!function(){try{var t=localStorage.getItem('theme'),h=document.documentElement,d=t?t==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;h.setAttribute('data-theme',d?'dark':'light');var v=d?['#08080a','#111114','#0d0d10','#e8e5e0','#8a8780','#5c5a55','#1e1d1b','#2d2b28','#d4a853','rgba(212,168,83,0.06)','rgba(212,168,83,0.12)','rgba(212,168,83,0.08)','0 4px 24px rgba(0,0,0,0.5)','0 12px 48px rgba(0,0,0,0.6)']:['#f8f7f5','#ffffff','#ffffff','#1a1816','#6e6b67','#9e9b97','#d6d3d0','#b8b5b0','#b8943f','rgba(184,148,63,0.06)','rgba(184,148,63,0.12)','rgba(184,148,63,0.08)','0 2px 12px rgba(0,0,0,0.04)','0 8px 32px rgba(0,0,0,0.06)'];var n=['--bg','--bg-card','--bg-surface','--text','--text-secondary','--text-tertiary','--border','--border-hover','--accent','--accent-light','--accent-mid','--accent-glow','--shadow','--shadow-lg'];for(var i=0;i<n.length;i++)h.style.setProperty(n[i],v[i])}catch(e){}}()</script>
<link rel="stylesheet" href="/static/css/styles.css?v=4">
  <style>
    .report-form { max-width: 640px; margin: 0 auto; }
    .report-form label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 4px; }
    .report-form .field { margin-bottom: 20px; }
    .report-form input, .report-form textarea, .report-form select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text); font-size: 14px; font-family: inherit;
      transition: border-color 0.15s;
    }
    .report-form input:focus, .report-form textarea:focus, .report-form select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
    }
    .report-form textarea { resize: vertical; min-height: 100px; }
    .severity-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .severity-grid label {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
      transition: all 0.15s; font-size: 12px; font-weight: 500; text-align: center;
    }
    .severity-grid input { display: none; }
    .severity-grid label:hover { border-color: var(--border-hover); }
    .severity-grid input:checked + label { border-color: var(--accent); background: var(--accent-light); }
  </style>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a>
    <button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button>
    <nav class="nav">
      <a class="nav-link" href="/programas">Programas</a>
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/report/new" style="color:var(--text);">Reportar bug</a>
      <a class="nav-link" href="/ai">IA Tools</a>
    </nav>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <div id="mobileNavLinks">
      <a class="nav-link" href="/programas">Programas</a>
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/report/new">Reportar bug</a>
      <a class="nav-link" href="/ai">IA Tools</a>
    </div>
  </div>
</header>

<section class="section">
  <div class="container report-form">
    <div style="margin-bottom:36px;">
      <div class="section-label">Reporte</div>
      <h1 class="section-title">Reportar vulnerabilidad</h1>
      <p class="section-sub" style="font-size:14px;">Describe el bug que encontraste. Sé claro y aporta todo el detalle posible.</p>
    </div>

    <form id="reportForm">
      <div class="field">
        <label>Programa</label>
        <select id="rfProgram" required>
          <option value="">Selecciona un programa</option>
        </select>
      </div>

      <div class="field">
        <label>Título</label>
        <input type="text" id="rfTitle" placeholder="Ej: SQL Injection en /api/users" required>
      </div>

      <div class="field">
        <label>Criticidad <span id="aiSeveritySuggestion" style="font-weight:400;font-size:12px;color:var(--text-tertiary);margin-left:8px;"></span></label>
        <div style="display:flex;gap:8px;align-items:start;flex-wrap:wrap;">
          <div class="severity-grid" id="rfSeverity" style="flex:1;">
            <input type="radio" name="severity" value="info" id="sevInfo">
            <label for="sevInfo" style="color:#6b6b75;">Info</label>
            <input type="radio" name="severity" value="low" id="sevLow">
            <label for="sevLow" style="color:#16a34a;">Bajo</label>
            <input type="radio" name="severity" value="medium" id="sevMed" checked>
            <label for="sevMed" style="color:#d97706;">Medio</label>
            <input type="radio" name="severity" value="high" id="sevHigh">
            <label for="sevHigh" style="color:#dc2626;">Alto</label>
            <input type="radio" name="severity" value="critical" id="sevCrit">
            <label for="sevCrit" style="color:#dc2626;font-weight:700;">Crítico</label>
          </div>
          <button type="button" class="btn btn-ghost" id="aiSuggestBtn" style="font-size:12px;padding:8px 12px;flex-shrink:0;" onclick="aiSuggestSeverity()">🤖 Sugerir</button>
        </div>
      </div>

      <div class="field">
        <label>Descripción</label>
        <textarea id="rfDesc" placeholder="Explica la vulnerabilidad en detalle..." required></textarea>
      </div>

      <div class="field">
        <label>Pasos para reproducir</label>
        <textarea id="rfSteps" placeholder="1. Ir a /api/users&#10;2. Inyectar...&#10;3. Observar..." style="min-height:120px;font-family:monospace;"></textarea>
      </div>

      <div class="field">
        <label>Impacto</label>
        <textarea id="rfImpact" placeholder="¿Qué podría hacer un atacante con esto?"></textarea>
      </div>

      <button type="submit" class="btn btn-accent" style="width:100%;justify-content:center;">Enviar reporte</button>
    </form>
  </div>
</section>

<div class="toast" id="toast"></div>

<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js?v=3"></script>
<script>
async function loadPrograms() {
  try {
    const res = await fetch('/api/programs?per_page=50');
    const data = await res.json();
    const sel = document.getElementById('rfProgram');
    (data.items || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.company_name} (${p.industry}) — hasta ${p.max_reward.toLocaleString()}€`;
      sel.appendChild(opt);
    });
  } catch {}
}

document.getElementById('reportForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = localStorage.getItem('token');
  if (!token) { showToast('Debes iniciar sesión primero'); return; }

  const severity = document.querySelector('input[name="severity"]:checked');
  const body = {
    title: document.getElementById('rfTitle').value,
    description: document.getElementById('rfDesc').value,
    severity: severity ? severity.value : 'medium',
    steps: document.getElementById('rfSteps').value,
    impact: document.getElementById('rfImpact').value,
    program_id: parseInt(document.getElementById('rfProgram').value),
  };

  try {
    const res = await fetch('/api/reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const d = await res.json(); showToast(d.detail || 'Error al enviar'); return; }
    showToast('¡Reporte enviado correctamente!');
    document.getElementById('reportForm').reset();
    setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
  } catch { showToast('Error de conexión'); }
});

loadPrograms();

async function aiSuggestSeverity() {
  const title = document.getElementById('rfTitle').value.trim();
  const desc = document.getElementById('rfDesc').value.trim();
  if (!title && !desc) { showToast('Escribe al menos un título o descripción'); return; }
  const token = localStorage.getItem('token');
  if (!token) { showToast('Debes iniciar sesión'); return; }
  const btn = document.getElementById('aiSuggestBtn');
  btn.disabled = true;
  btn.textContent = '🤔 Analizando...';
  try {
    const res = await fetch('/api/ai/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ title, description: desc }),
    });
    if (!res.ok) { showToast('Error al analizar'); return; }
    const data = await res.json();
    const sev = data.severity;
    const radio = document.querySelector(`input[name="severity"][value="${sev}"]`);
    if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change')); }
    const label = document.getElementById('aiSeveritySuggestion');
    const sevMap = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
    label.textContent = `🤖 ${sevMap[sev] || sev} sugerido — CWE:${data.cwe_id || 'N/A'} CVSS:${data.cvss_score || 'N/A'}`;
    setTimeout(() => { label.textContent = ''; }, 8000);
  } catch { showToast('Error de conexión'); }
  finally { btn.disabled = false; btn.textContent = '🤖 Sugerir'; }
}
</script>
</body>
</html>
