<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo"><svg viewBox="0 0 32 32" width="16" height="16" style="display:inline-block"><rect width="32" height="32" rx="8" fill="#d4a853"/><circle cx="16" cy="16" r="10" fill="none" stroke="#08080a" stroke-width="1.5"/><circle cx="16" cy="16" r="5" fill="none" stroke="#08080a" stroke-width="1" opacity="0.6"/><line x1="16" y1="4" x2="16" y2="7" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="16" y1="25" x2="16" y2="28" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="7" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><line x1="25" y1="16" x2="28" y2="16" stroke="#08080a" stroke-width="1.5" stroke-linecap="round"/><path d="M13 19 L16 12 L19 19" fill="none" stroke="#08080a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vuln</span>ify</a><button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menú"><span></span><span></span><span></span></button><nav class="nav"><a class="nav-link" href="/programas">Programas</a><a class="nav-link" href="/stats" style="color:var(--text);">Estadísticas</a><a class="nav-link" href="/hall-of-fame">Hall of Fame</a></nav><div class="header-actions"><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button><div id="headerAuth"><button class="btn btn-ghost" onclick="openModal('login')">Iniciar sesión</button><button class="btn btn-primary" onclick="openModal('register')">Registrarse →</button></div><div id="headerUser" style="display:none;align-items:center;gap:8px"><a href="/dashboard" class="btn btn-ghost" id="headerUserName" style="font-weight:600"></a><button class="btn btn-ghost" onclick="logout()" style="font-size:12px">Salir</button></div></div></div>

  <div id="mobileNavLinks">
    <a class="nav-link" href="/programas">Programas</a>

  </div>
</div>
</header>

<section class="section"><div class="container">
  <div class="section-header" style="margin-bottom:40px">
    <div class="section-label">Estadísticas</div>
    <h1 class="section-title">Plataforma en cifras</h1>
    <p class="section-sub">Datos globales de la comunidad Vulnify.</p>
  </div>

  <div class="stats-row" style="margin-bottom:40px" id="globalStats">
    <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px" id="sPrograms">—</div><div class="stat-counter-label">Programas activos</div></div>
    <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:var(--accent2)" id="sReports">—</div><div class="stat-counter-label">Reportes totales</div></div>
    <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:#16a34a" id="sHunters">—</div><div class="stat-counter-label">Hunters</div></div>
    <div class="stat-counter"><div class="stat-counter-num" style="font-size:32px;color:var(--accent)" id="sCompanies">—</div><div class="stat-counter-label">Empresas</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:16px">Reportes por severidad</h3>
      <div id="severityBars"></div>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px">
      <h3 style="font-size:14px;font-weight:600;margin-bottom:16px">Programas top</h3>
      <div id="topPrograms"></div>
    </div>
  </div>
</div></section>

<div class="modal-overlay" id="modalOverlay"><div class="modal-body" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<button class="back-top" id="backTop" aria-label="Volver arriba">&#8593;</button>
<script src="/static/js/script.js?v=5"></script>
<script>
(async()=>{
  try {
    const s = await (await fetch('/api/stats')).json();
    document.getElementById('sPrograms').textContent = s.total_programs;
    document.getElementById('sReports').textContent = s.total_reports;
    document.getElementById('sHunters').textContent = s.total_hunters;
    document.getElementById('sCompanies').textContent = s.total_companies;

    const sevColors = {critical:'var(--accent)',high:'#ef4444',medium:'#d97706',low:'#22c55e',info:'var(--text-tertiary)'};
    const sevLabels = {critical:'Crítico',high:'Alto',medium:'Medio',low:'Bajo',info:'Info'};
    const sevEl = document.getElementById('severityBars');
    const maxSev = Math.max(...Object.values(s.severity_counts||{}), 1);
    for(const [k,v] of Object.entries(s.severity_counts||{})){
      sevEl.innerHTML += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' +
        '<span style="width:50px;font-size:12px;font-weight:600;flex-shrink:0">' + sevLabels[k] + '</span>' +
        '<div style="flex:1;height:22px;background:var(--bg-surface);border-radius:var(--radius-sm);overflow:hidden">' +
        '<div style="width:' + (v/maxSev*100) + '%;height:100%;background:' + (sevColors[k]||'var(--accent)') + ';border-radius:var(--radius-sm);transition:width .6s"></div></div>' +
        '<span style="width:30px;text-align:right;font-size:12px;font-weight:600">' + v + '</span></div>';
    }

    const topEl = document.getElementById('topPrograms');
    if((s.top_programs||[]).length){
      s.top_programs.forEach((p,i) => {
        topEl.innerHTML += '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">' +
          '<span style="width:24px;font-weight:700;color:var(--text-tertiary);font-size:13px">' + (i+1) + '</span>' +
          '<span style="flex:1;font-size:13px;font-weight:500">' + p.company_name + '</span>' +
          '<span style="font-size:12px;font-weight:600;color:var(--accent)">' + p.reports + ' reportes</span></div>';
      });
    } else {
      topEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px">Sin datos todavía</div>';
    }
  } catch {
    document.getElementById('globalStats').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-tertiary);grid-column:1/-1">Error al cargar estadísticas</div>';
  }
})();
</script>
</body>
</html>
